<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#141828" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Ambient Halo -->
  <circle cx="200" cy="210" r="140" fill="url(#halo)" />

  <!-- Avatar Silhouette Outer Ring -->
  <circle cx="200" cy="180" r="70" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Avatar Head -->
  <circle cx="200" cy="180" r="54" fill="#1b2238" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#softGlow)" />

  <!-- Body / Shoulders -->
  <path d="M 105 390 C 110 300, 150 265, 200 265 C 250 265, 290 300, 295 390 Z" fill="#171e33" stroke="url(#glowGrad)" stroke-width="2" />

  <!-- Cybernetic Core / Emblem -->
  <polygon points="200,285 212,305 188,305" fill="#06b6d4" opacity="0.8" />

  <!-- Letter 'अ' Glyph watermark in background -->
  <text x="200" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="4" text-anchor="middle" opacity="0.6">AVINYA '26 CREW</text>
</svg>
